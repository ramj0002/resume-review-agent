[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-review"
version = "0.1.0"
description = "Recruiter-style resume review against a job ad: Claude for judgement, Python for the facts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "pypdf>=4", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resume-review = "resume_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
